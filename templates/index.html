{% extends "base.html" %}

{% block content %}
<h1>Raccourcisseur d'URL avec QR Code</h1>

<form method="POST" action="/shorten">
    <div class="form-group">
        <label for="url">Entrez votre URL longue :</label>
        <input type="url" id="url" name="url" placeholder="https://example.com/very/long/url" required>
    </div>
    <button type="submit">Raccourcir l'URL</button>
</form>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
{% endblock %}
