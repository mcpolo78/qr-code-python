{% extends "base.html" %}

{% block content %}
<h1>Générateur de QR Code</h1>

<form method="POST" action="/generate">
    <div class="form-group">
        <label for="text">Entrez votre texte ou URL :</label>
        <textarea id="text" name="text" placeholder="Texte, URL, numéro de téléphone, etc." rows="4" required></textarea>
    </div>
    <button type="submit">Générer le QR Code</button>
</form>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
{% endblock %}
