{% extends "base.html" %}

{% block title %}QR Code Généré - Générateur de QR Code{% endblock %}

{% block content %}
<h1>QR Code généré avec succès !</h1>

<div class="result">
    <h3>Texte encodé :</h3>
    <div class="url-display">{{ text }}</div>
    
    <div class="qr-code">
        <h3>QR Code :</h3>
        <form method="POST" action="/qr" target="_blank">
            <input type="hidden" name="text" value="{{ text }}">
            <button type="submit" style="background: none; border: none; cursor: pointer;">
                <div style="width: 300px; height: 300px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    Cliquez pour générer le QR Code
                </div>
            </button>
        </form>
        <p><small>Cliquez sur l'image ci-dessus pour générer et télécharger le QR code</small></p>
    </div>
</div>

<p><a href="/">Générer un autre QR Code</a></p>
{% endblock %}
